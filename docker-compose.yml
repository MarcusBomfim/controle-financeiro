services:
  database:
    image: postgres:17-alpine
    container_name: controle-financeiro-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: controle_financeiro
      POSTGRES_USER: finance_admin
      POSTGRES_PASSWORD: finance_dev
    ports:
      - "5434:5432"
    volumes:
      - controle_financeiro_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_admin -d controle_financeiro"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: controle-financeiro-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3333
      CLIENT_URL: http://localhost:8080
      DATABASE_URL: postgresql://finance_admin:finance_dev@database:5432/controle_financeiro?schema=public
      SESSION_TTL_HOURS: 8
      RATE_LIMIT_TTL_MS: 60000
      RATE_LIMIT_MAX: 120
      COOKIE_SECURE: "false"
    ports:
      - "3333:3333"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3333/api/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: controle-financeiro-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  controle_financeiro_data:
