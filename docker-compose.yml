services:
  database:
    image: postgres:17-alpine
    container_name: controle-financeiro-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: controle_financeiro
      POSTGRES_USER: finance_admin
      POSTGRES_PASSWORD: finance_dev
    ports:
      - "5434:5432"
    volumes:
      - controle_financeiro_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_admin -d controle_financeiro"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  controle_financeiro_data:
